<!DOCTYPE html>
<html>

<head>

    <title>Fire Alert System - Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body class="login-page">

<div class="login-box">

    <h1>🔥 Fire Alert System</h1>

    <p>Admin Login</p>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}

</div>

</body>
</html>
